name: Deploy portfolio to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_lwcMOed4XZsuFuJw8oMO9K90
      VERCEL_PROJECT_ID: prj_zkzgSExmeZzKtLXmLhPiMhya1vmm
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3
      - name: Load production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.PORTFOLIO_VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope=blanco-ricecake-s-projects --token="$VERCEL_TOKEN"
      - name: Build the portfolio
        env:
          VERCEL_TOKEN: ${{ secrets.PORTFOLIO_VERCEL_TOKEN }}
        run: vercel build --prod --scope=blanco-ricecake-s-projects --token="$VERCEL_TOKEN"
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.PORTFOLIO_VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --prod --scope=blanco-ricecake-s-projects --token="$VERCEL_TOKEN" > deployment-url.txt
          printf '### Portfolio deployed\n\nCommit: `%s`\n\nDeployment: %s\n\nWebsite: https://www.portfolio-janghyerim.com/\n' "$GITHUB_SHA" "$(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the live project page matches this commit
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "https://www.portfolio-janghyerim.com/proj-05.html?deploy=$GITHUB_SHA" -o /tmp/live-proj-05.html && cmp --silent proj-05.html /tmp/live-proj-05.html; then
              echo 'Live proj-05.html matches the pushed commit.'
              exit 0
            fi
            sleep 5
          done
          echo 'The live project page does not match this commit.' >&2
          exit 1
