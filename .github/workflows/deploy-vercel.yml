name: Deploy portfolio to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_lwcMOed4XZsuFuJw8oMO9K90
      VERCEL_PROJECT_ID: prj_zkzgSExmeZzKtLXmLhPiMhya1vmm
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Deploy and verify the live portfolio
        env:
          VERCEL_TOKEN: ${{ secrets.PORTFOLIO_VERCEL_TOKEN }}
        run: node .github/scripts/deploy-vercel.mjs
