  <script src="ktmmobile.js"></script>
  <script>
    (function () {
      var IMG = KTM.IMG;
      var events = KTM.events;
      var slides = events.filter(function (e) { return !e.listOnly; });
      var slidesEl = document.getElementById('kmSlides');
      var tabsEl = document.getElementById('kmTabs');
      var gridEl = document.getElementById('kmGrid');
      var controls = document.getElementById('kmControls');
      var curEl = controls.querySelector('.cur');
      var totEl = controls.querySelector('.tot');
      var pauseBtn = controls.querySelector('.km-controls__pause');

      var mobileMq = window.matchMedia('(max-width: 768px)');

      var slideEls = slides.map(function (e, i) {
        var s = document.createElement('div');
        s.className = 'km-slide';
        s.style.setProperty('--pc', e.pc);
        s.style.setProperty('--mo', e.mo);
        s.setAttribute('role', 'group');
        s.setAttribute('aria-roledescription', 'slide');
        s.setAttribute('aria-label', (i + 1) + ' / ' + slides.length + ' ' + e.title);
        var link = document.createElement('a');
        link.className = 'km-slide__link';
        link.href = KTM.detailUrl(e);
        var pic = document.createElement('picture');
        var src = document.createElement('source');
        src.media = '(max-width: 768px)';
        src.srcset = IMG + e.n + '-mo.' + e.ext;
        var img = document.createElement('img');
        img.src = IMG + e.n + '-pc.' + e.ext;
        img.alt = e.caption;
        if (i > 0) img.loading = 'lazy';
        pic.appendChild(src); pic.appendChild(img);
        link.appendChild(pic);
        s.appendChild(link);
        slidesEl.appendChild(s);
        return s;
      });

      var tabEls = slides.map(function (e, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'km-tab';
        b.setAttribute('role', 'tab');
        b.innerHTML = '<p>' + e.title + '</p><img src="' + IMG + e.n + '-thumb.png" alt="">';
        b.addEventListener('click', function () { goTo(i); restart(); });
        tabsEl.appendChild(b);
        return b;
      });

      events.forEach(function (e) {
        var li = document.createElement('li');
        li.innerHTML = '<a class="km-event" href="' + KTM.detailUrl(e) + '"><img src="' + IMG + e.n + '-list.webp" alt="" loading="lazy"><p>[' + e.cat + '] ' + e.caption + '</p></a>';
        gridEl.appendChild(li);
      });

      var current = 0, timer = null, paused = false;
      var INTERVAL = 4000;

      totEl.textContent = slides.length;

      function goTo(i) {
        current = (i + slides.length) % slides.length;
        slideEls.forEach(function (s, k) { s.classList.toggle('is-active', k === current); });
        tabEls.forEach(function (t, k) {
          t.classList.toggle('is-active', k === current);
          t.setAttribute('aria-selected', k === current ? 'true' : 'false');
        });
        curEl.textContent = current + 1;
        controls.dataset.theme = slides[current].theme;
        // keep the active tab at the head of the strip, like the live site
        tabsEl.scrollLeft = tabEls[current].offsetLeft - tabsEl.offsetLeft;
      }

      function start() {
        if (paused || timer) return;
        timer = setInterval(function () { goTo(current + 1); }, INTERVAL);
      }
      function stop() { clearInterval(timer); timer = null; }
      function restart() { stop(); start(); }

      controls.querySelector('.km-controls__prev').addEventListener('click', function () { goTo(current - 1); restart(); });
      controls.querySelector('.km-controls__next').addEventListener('click', function () { goTo(current + 1); restart(); });
      pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        pauseBtn.querySelector('.c-hidden').textContent = paused ? '자동재생 시작' : '자동재생 정지';
        if (paused) stop(); else start();
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stop(); else start();
      });

      goTo(0);
      start();
      KTM.initTopButton();

      // The banners and cards are built here, so the browser resolved
      // #events against an empty page. Land on it again now it exists, and
      // once more after the art loads, since that shifts the page under us.
      if (location.hash === '#events') {
        var land = function () {
          var el = document.getElementById('events');
          var offset = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
          // explicit 'auto' so the page's smooth scrolling does not animate it
          window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - offset, behavior: 'auto' });
        };
        land();
        // the art above the list has no reserved height, so the page still
        // shifts after this point — land again once it has all arrived
        window.addEventListener('load', function () {
          land();
          requestAnimationFrame(land);
        });
      }
    })();
  </script>
